<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <link rel="stylesheet" href="payment.css">
</head>
<body>
    <div class="container">
        <h1>Payment Information</h1>
        <form id="payment-form">
            <div class="form-group">
                <label for="card-name">Cardholder Name</label>
                <input type="text" id="card-name" required>
                <span class="error-message"></span> <!-- Error message element -->
            </div>
            <div class="form-group">
                <label for="card-number">Card Number</label>
                <input type="text" id="card-number" required>
                <span class="error-message"></span> <!-- Error message element -->
            </div>
            <div class="form-group">
                <label for="expiry-date">Expiry Date (MM/YY)</label>
                <input type="month" id="expiry-date" placeholder="MM/YYYY" required>
                <span class="error-message"></span> <!-- Error message element -->
            </div>
            <div class="form-group">
                <label for="cvv">CVV</label>
                <input type="password" id="cvv" required>
                <span class="error-message"></span> <!-- Error message element -->
            </div>
            <button type="submit">Pay Now</button>
        </form>
        
        <!-- Booking Confirmation Popup -->
        <div id="bookingConfirmation" style="display:none;">    
            <h3>Slot Booked Successfully!</h3>
            <p id="bookingDetails"></p>
        </div>
        
    </div>
    <script src="payment.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Random Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7fc;
        }
        .container {
            width: 80%;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        h4 {
            color: #555;
        }
        .password-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .password-box input {
            width: 70%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f9f9f9;
            cursor: not-allowed;
        }
        .password-box button {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .password-box button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        /* Link styles */
        .btn-login {
            display: block;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            text-align: center;
            border-radius: 4px;
            text-decoration: none;
            cursor: not-allowed;
            opacity: 0.6;
        }
        /* Styling for the enabled link */
        .btn-login.enabled {
            opacity: 1;
            cursor: pointer;
        }
        .btn-login:disabled {
            background-color: #aaa;
            color: #666;
        }
        .banner {
            background-color: #ff9800;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        .info-text {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Banner -->
        <div class="banner">
            Your Account
        </div>

        
        <!-- Password Display -->
        <h4>Your Password</h4>
        <div class="password-box">
            <input type="text" id="passwordBox" readonly />
            <button id="copyButton" onclick="copyPassword()" disabled>Copy Password</button>
        </div>

        <p class="info-text">To access your account, simply copy your password above and login.<br><br>
            Do not refresh as you will not be able to revisit this link.</p>

        <!-- Login Link -->
        <a href="./Login/Login.html" id="loginLink" class="btn-login" style="pointer-events: none;" disabled>Login to Your Account</a>
    </div>

    <script>
        // Function to generate a random password
        function generatePassword() {
            const length = 32; // Desired length of the password
            const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_-+=<>?"; // Set of characters to use
            let password = "";

            // Generate a random password by picking characters from the charset
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * charset.length); 
                password += charset[randomIndex]; 
            }

            // Display the generated password in the input box and enable the copy button
            document.getElementById("passwordBox").value = password;
            document.getElementById("copyButton").disabled = false;
        }

        // Function to copy the password to clipboard
        function copyPassword() {
            const passwordBox = document.getElementById("passwordBox");
            passwordBox.select();
            document.execCommand("copy");
            

            // Change the button text to indicate the password has been copied
            document.getElementById("copyButton").innerText = "Password Copied";

            // Enable the login link and make it look like a clickable button
            const loginLink = document.getElementById("loginLink");
            loginLink.classList.add("enabled");  // Add the 'enabled' class
            loginLink.style.pointerEvents = 'auto';  // Enable the link
        }

        // Call the generatePassword function immediately when the page loads
        window.onload = generatePassword;

        const email = localStorage.getItem('email');

        document.getElementById('copyButton').addEventListener("click", async () => {
        const password = document.getElementById('passwordBox').value;


            
            // Prepare data to send to the backend
            const userData = {
                email: email,      // Email from localStorage
                password: password // Password from the current form
            };


             // Send data to the backend using fetch
                 fetch("http://localhost:3000/send-email", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(userData)
            })
            .then(response => response.text())
            .then(data => {
                alert(data);  // Display success message
                localStorage.removeItem('email');  // Optionally, clear email from localStorage
                // window.location.href = "../Login.html"; // Redirect to a success page (optional)
            })
            .catch(error => {
                console.error("Error:", error);
            });
});

    </script>

</body>
</html>
